# Perfiles del proyecto; heredan modelo y permisos de la sesión.
[agents]
enabled = true
max_concurrent_threads_per_session = 5

[agents.analista]
description = "Analiza nuevos requerimientos, detecta vacíos o ambigüedades, formula preguntas de clarificación y define criterios de aceptación."
config_file = "../app/agents/analista.toml"

[agents.disenador]
description = "Diseña y valida cada ventana, componente e interacción visual de la interfaz (UI/UX, temas, responsividad y accesibilidad)."
config_file = "../app/agents/disenador.toml"

[agents.implementador]
description = "Implementa cambios en archivos asignados por el orquestador."
config_file = "../app/agents/implementador.toml"

[agents.qa_tester]
description = "Ejecuta pruebas unitarias rápidas en cambios pequeños y la suite completa al preparar commit/sincronización, sin editar fuentes."
config_file = "../app/agents/qa-tester.toml"

[agents.auditor]
description = "Ejecuta todas las auditorías de arneses y guardrails al momento del commit y sincronización, sin editar archivos."
config_file = "../app/agents/auditor.toml"
