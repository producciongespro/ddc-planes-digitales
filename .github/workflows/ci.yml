name: MEP Quality Gate & Test Harness (CI)

on:
  push:
    branches:
      - ddc-planes-digitales-1.0.0
      - main
  pull_request:
    branches:
      - ddc-planes-digitales-1.0.0
      - main

jobs:
  quality-gate:
    name: Guardrails, Unit Tests & Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./app

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './app/package-lock.json'

      - name: 📦 Instalar dependencias limpias
        run: npm ci

      - name: 🛡️ Ejecutar Auditoría de Guardrails (Anti-Mojibake, Zero-Windows-Paths, Desacople)
        run: npm run audit:guardrails

      - name: 🧪 Ejecutar Suite Completa de Pruebas (39 pruebas + 20 Viewports)
        run: npm test

      - name: 🏗️ Verificar Compilación Limpia de Producción (Bundle < 300 KB)
        run: npm run build
